plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = "mustve-been-the-wind"
}

repositories {
	// Loom adds the essential Minecraft/Fabric repositories automatically.
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
	maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"windsmoke" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Optional local automation. Enable with -PwindsmokeTest when a
			// "New World" test save exists; normal runClient stays vanilla.
			if (project.hasProperty("windsmokeTest")) {
				programArgs "--quickPlaySingleplayer", "New World"
				vmArg "-Dwindsmoke.testharness=true"
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Sodium is optional at runtime. Its compatibility mixins are compiled
	// against this version but only load when Sodium is present.
	compileOnly("net.caffeinemc:sodium-fabric:${project.sodium_version}") {
		transitive = false
	}

	if (project.hasProperty("sodiumTest")) {
		runtimeOnly("net.caffeinemc:sodium-fabric:${project.sodium_version}") {
			transitive = false
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
